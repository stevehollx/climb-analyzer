# This is for v2 of the app not yet posted--staging this file to test some version checking code.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climb-analyzer"
version = "2.1.0"
description = "Analyze road and trail climbs from OpenStreetMap data"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Climb Analyzer Team"}
]
license = {text = "MIT"}

# Core dependencies - required for both local and cloud modes
dependencies = [
    "geopy>=2.3.0",
    "reverse-geocoder>=1.5.1",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0",
    "openpyxl>=3.0.0",
    "xlsxwriter>=3.0.0",
    "PyJWT>=2.8.0",  # GitHub App authentication for cloud cache
    "cryptography>=41.0.0",  # Required by PyJWT for RSA key handling
    "tomli>=2.0.0; python_version < '3.11'",  # For reading pyproject.toml (built-in in Python 3.11+)
    "pybloom-live>=4.0.0",  # Memory-efficient bloom filters for large-scale deduplication
]

[project.optional-dependencies]
# Local deployment mode - Process OSM .pbf files locally
# Requires: Planet OSM file downloaded, spatial index created
# Best for: High-volume analysis, offline processing, complete control
local = [
    "osmium>=3.7.0",    # OSM file parsing (requires libosmium C++ library)
    "rtree>=1.0.0",     # Spatial indexing (requires libspatialindex)
]

# Cloud deployment mode - Query Overpass API
# Requires: Internet connection, Overpass API access
# Best for: Quick analysis, small regions, no local storage requirements
cloud = [
    "overpy>=0.6",      # Overpass API client
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.0.260",
]

# Geographic data utilities - For updating geo definitions
geo = [
    "geopandas>=0.14.0",  # Geographic data processing (requires GDAL/GEOS system libs)
]

# Install all modes (for testing both deployment types)
all = [
    "osmium>=3.7.0",
    "rtree>=1.0.0",
    "overpy>=0.6",
    "geopandas>=0.14.0",
]

[project.scripts]
climb-analyzer = "climb_analyzer:main"
climb-analyzer-v2 = "climb_analyzer_main:main"
download-osm = "utils.cli_download_osm:main"
download-elevation = "utils.cli_download_elevation:main"
build-index = "utils.cli_build_index:main"
data-setup = "data_setup:main"
update-geo = "utils.update_geo_definitions:main"

[tool.setuptools]
py-modules = [
    "climb_analyzer",
    "climb_analyzer_main",
    "data_manager",
    "elevation_dataset_selector",
    "data_setup",
    "data_setup_main",
    "batch_progress",
    "batch_cleanup",
    "batch_runner",
    "config_loader",
    "dem_downloaders",
    "geographic_menu",
    "osm_downloader",
    "geo_definitions",
    "index_builder",
    "region_detector",
    "region_mapper",
    "deployment_mode_wizard",
    "data_validator",
    "dataset_selector",
    "setup_wizard",
    "data_coverage_checker",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["climb_analyzer*", "climb_analyzer_new*", "utils*", "opentopodata*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"

# Linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
